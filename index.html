<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Issue Tracker</title>
    <!-- font-awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!-- google font integration -->
    
    
    
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link rel="stylesheet" href="style/style.css">
</head>
<body>
    <header>
        <div class="nav-container flex justify-between items-center bg-gray-100 pt-[16px] pb-[16px] pl-20 pr-20">
                <div class="nav-logo flex gap-2">
                    <img src="assets/github-logo.png" alt="GitHub Logo" class="nav-logo-img w-8 h-8 ">
                    <h2 class="nav-logo-h2 font-semibold text-2xl">GitHub Issues Tracker</h2>
                </div>
                <div class="nav-search flex gap-2 items-center">
                    <div class="relative">
                         <img
                            src="assets/search_24dp_E3E3E3_FILL0_wght400_GRAD0_opsz24.png"
                            alt=""
                            class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 opacity-60">

                          <input
                             type="text"
                             placeholder="Search issues..."
                             class="w-[230px] h-10 pl-10 pr-4 border border-gray-300 rounded-md bg-white text-sm placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-gray-200">

                    </div>
                        <button class="search-btn btn btn-primary text-white  px-5 py-2 rounded-md">
                           + New Issue
                        </button>
                    </div>
                </div>
        </nav>
    </header>


 <section class="card-section pt-10 justify-center h-screen bg-red-100 px-[245px] py-[60px]">
        <div class="filter-btns gap-4 mb-4 bg-gray-100 p-4 rounded-md">
            <button class="btn btn-primary text-white  rounded-md ">ALL</button>
            <button class="btn btn-primary text-white  rounded-md ">Open</button>
            <button class="btn btn-primary text-white  rounded-md ">Close</button>
        </div>
        <div class="card w-96 bg-white shadow-lg border border-gray-200 overflow-hidden">

    
    <div class="h-1 bg-emerald-500"></div>

    <div class="card-body">

        <!-- Header -->
        <div class="flex justify-between items-start">

            <!-- Icon -->
            <div id = "issue-icon" class="w-12 h-12 rounded-full bg-emerald-100 flex items-center justify-center">
                <img src="assets/Open-Status.png" alt="" class="w-6 h-6">
            </div>

            <!-- Priority -->
            <div id = "issue-priority" class="badge badge-lg bg-red-100 text-red-500 border-0 rounded-full px-10 py-5">
                HIGH
            </div>

        </div>

     
        <h2 id = "issue-title" class="card-title text-3xl font-bold leading-tight mt-5">
            Fix Navigation Menu On Mobile Devices
        </h2>

     
        <p id = "issue-description" class="text-gray-500 text-xl mt-3 leading-relaxed">
            The navigation menu doesn't collapse properly on mobile devices...
        </p>

        
        <div class="flex gap-3 mt-6">

            <div id = "issue-type" class="badge badge-outline badge-error rounded-full px-5 py-4">
                 <img src="assets/Screenshot 2026-08-03 130035.png" alt="" class="w-6 h-6"> BUG
            </div>

            <div id = "issue-label" class="badge badge-outline badge-warning rounded-full px-5 py-4">
                <img src="assets/Screenshot 2026-08-03 130048.png" alt="" class="w-6 h-6"> HELP WANTED
            </div>

        </div>

    </div>

    <div id = "issue-meta" class="border-t border-gray-200 px-8 py-6">

        <p id = "issue-author" class="text-gray-500 text-lg">
            #1 &nbsp; by john_doe
        </p>
        <p id = "issue-date" class="text-gray-500 text-lg mt-2">
            1/15/2024
        </p>

    </div>

 </div>
</section>
       
</body>
</html>
