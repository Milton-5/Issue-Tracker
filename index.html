<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Issue Tracker</title>
    <!-- font-awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!-- google font integration -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <!-- tailwind and daisyui -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link rel="stylesheet" href="style/style.css">
</head>
<body>
    <header>
        <div class="nav-container flex justify-between items-center bg-gray-100 pt-[16px] pb-[16px] pl-20 pr-20">
                <div class="nav-logo flex gap-2">
                    <img src="assets/github-logo.png" alt="GitHub Logo" class="nav-logo-img w-8 h-8 ">
                    <h2 class="nav-logo-h2 font-semibold text-2xl">GitHub Issues Tracker</h2>
                </div>
                <div class="nav-search flex gap-2 items-center">
                    <div class="relative">
                         <img
                            src="assets/search_24dp_E3E3E3_FILL0_wght400_GRAD0_opsz24.png"
                            alt=""
                            class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 opacity-60">

                          <input
                             type="text"
                             placeholder="Search issues..."
                             class="w-[230px] h-10 pl-10 pr-4 border border-gray-300 rounded-md bg-white text-sm placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-gray-200">

                    </div>
                        <button class="search-btn btn btn-primary text-white  px-5 py-2 rounded-md">
                           + New Issue
                        </button>
                    </div>
                </div>
        </nav>
    </header>


    <section class="card-section pt-10 justify-center h-screen bg-red-100 px-[245px] py-[60px]">
        <div class="filter-btns gap-4 mb-4 bg-gray-100 p-4 rounded-md">
            <button class="btn btn-primary text-white  rounded-md ">ALL</button>
            <button class="btn btn-primary text-white  rounded-md ">Open</button>
            <button class="btn btn-primary text-white  rounded-md ">Close</button>
        </div>
        <div class="card bg-base-100 w-96 shadow-sm ">
            <div class="card-body">
                <div class="badge flex justify-left badge-soft badge-primary">Primary</div>
                 <h2 class="card-title">Fix navigation menu on mobile devices</h2>
                 <p>The navigation menu doesn't collapse properly on mobile devices...</p>
                 <div class="card-actions justify-end">
                       <button class="btn btn-primary">Buy Now</button>
                 </div>
            </div>
        </div>
    </section>
    
</body>
</html>
