    <!-- font-awesome -->

    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

<body>
    <section class="login-section px-8 py-12">
        <div class="flex justify-center items-center">
            <div class="login-container border border-gray-300 rounded-lg p-8 shadow-md w-full max-w-md">
            <h1 class="login-title flex justify-center text-2xl font-bold">GitHub Issues Tracker</h1>
            <h1 class="login-title flex justify-center ">Sign In to manage your issues</h1>
            <form action="login.php" method="POST" class="login-form">
                <div class="form-group flex flex-col mb-4 rounded-lg">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="form-group flex flex-col mb-4">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <div class="form-group flex flex-col justify-center">
                    <button type="submit" class="login-button w-full border border-blue-500 hover:bg-blue-600">Sign In</button>
                    <h1 class="login-title flex justify-center mt-4">Or</h1>
                </div>
            </form>
        </div>
    </section>

        
</body>
</html>
